nyc-safety/new-lanes#near_new_lane:
  approved: '2026-11-09'
  by: nyc-safety
  facts:
  - 2 years
  - 50 meters
  hash: 0b23ea5c268f
  owner: nyc-safety
  term: near_new_lane
  text: >-
    A crash counts as near a new protected lane if it happened within about 50 meters (half a block) of
    the lane segment. We compare the 2 years before the lane went in with the 2 years after.
nyc-safety/new-lanes#new_lane:
  approved: '2026-11-09'
  by: nyc-safety
  facts:
  - January 2015
  - July 2012
  - October 2024
  hash: 6a6320b41a6e
  owner: nyc-safety
  term: new_lane
  text: >-
    Only segments that got their first protected lane between January 2015 and October 2024 count, so
    both windows fall inside the crash data, which starts in July 2012.
