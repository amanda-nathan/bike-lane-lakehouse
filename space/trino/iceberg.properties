# Cloudflare R2 Data Catalog, read-only key. Values come from the Space's secrets.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:R2_CATALOG_URI}
iceberg.rest-catalog.warehouse=${ENV:R2_WAREHOUSE}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=${ENV:R2_READ_TOKEN}

fs.native-s3.enabled=true
s3.endpoint=${ENV:R2_ENDPOINT}
s3.region=auto
s3.path-style-access=true
s3.aws-access-key=${ENV:R2_READ_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:R2_READ_SECRET_ACCESS_KEY}
