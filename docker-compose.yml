# rustfs: S3 API on 9000, console on 9001
# iceberg-rest: catalog on 8181
# trino: 8080
# postgres: 5432 (live Bluebikes station status)
# dagster: 3000 (schedules and runs the loads)
# jupyter: 8888 (notebooks)
# mcp: 8000 (MCP server, streamable HTTP at /mcp)
#
# Secrets come from .env (copy .env.example).

services:
  rustfs:
    restart: unless-stopped
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env, see .env.example}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env, see .env.example}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data

  # creates the landing and warehouse buckets, then exits
  s3-init:
    image: amazon/aws-cli:2.27.50
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env, see .env.example}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env, see .env.example}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://landing 2>/dev/null || true;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://warehouse 2>/dev/null || true;
      aws --endpoint-url http://rustfs:9000 s3 ls
      "

  iceberg-rest:
    restart: unless-stopped
    build: ./catalog
    depends_on:
      s3-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env, see .env.example}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env, see .env.example}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${POSTGRES_USER:?set in .env, see .env.example}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?set in .env, see .env.example}
    ports:
      - "127.0.0.1:8181:8181"

  postgres:
    restart: unless-stopped
    image: postgres:17.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env, see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env, see .env.example}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      retries: 30

  trino:
    restart: unless-stopped
    image: trinodb/trino:476
    # Trino sizes its heap to 80% of the memory it sees. Without a limit it sees all of
    # Docker's memory and gets killed when other services need some.
    mem_limit: ${TRINO_MEMORY:-5g}
    depends_on:
      - iceberg-rest
      - postgres
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env, see .env.example}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env, see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env, see .env.example}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro

  dagster:
    restart: unless-stopped
    build:
      context: .
      target: app
    depends_on:
      - iceberg-rest
      - postgres
    environment:
      S3_ENDPOINT: http://rustfs:9000
      ICEBERG_REST_URI: http://iceberg-rest:8181
      POSTGRES_HOST: postgres
      TRINO_HOST: trino
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env, see .env.example}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env, see .env.example}
      # optional: only the public/marts asset uses these
      R2_CATALOG_URI: ${R2_CATALOG_URI:-}
      R2_WAREHOUSE: ${R2_WAREHOUSE:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_TOKEN: ${R2_TOKEN:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env, see .env.example}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dagster-home:/dagster_home

  mcp:
    restart: unless-stopped
    build:
      context: .
      target: app
    command: ["bikelake-mcp", "--http", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - trino
    environment:
      TRINO_HOST: trino
    ports:
      - "127.0.0.1:8000:8000"

  jupyter:
    restart: unless-stopped
    build:
      context: .
      target: notebook
    depends_on:
      - trino
    environment:
      TRINO_HOST: trino
      S3_ENDPOINT: http://rustfs:9000
      ICEBERG_REST_URI: http://iceberg-rest:8181
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env, see .env.example}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env, see .env.example}
    ports:
      - "127.0.0.1:8888:8888"  # no login, so only reachable from this machine
    volumes:
      - ./notebooks:/app/notebooks
      - ./sql:/app/sql:ro

volumes:
  s3-data:
  pg-data:
  dagster-home:
