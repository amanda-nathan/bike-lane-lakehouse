[project]
name = "bikelake"
version = "0.1.0"
description = "Bike lanes, bikes, cars and crashes in Boston and NYC on an Iceberg + Trino lakehouse"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.29",
    "dagster-dbt>=0.29.29",
    "dagster-webserver>=1.13.29",
    "dbt-core>=1.12.6",
    "dbt-metricflow[dbt-trino]>=0.15.0",
    "dbt-trino>=1.11.0",
    "duckdb>=2.0.0",
    "mcp>=2.3.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "pyiceberg[pyarrow,pyiceberg-core]>=0.9",
    "python-dotenv>=1.2.4",
    "requests>=2.32",
    "sqlglot>=30.30.0",
    "trino>=0.333",
]

[project.scripts]
bikelake = "bikelake.cli:main"
bikelake-mcp = "bikelake.mcp_server:main"
bikelake-knowledge = "bikelake.knowledge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikelake"]

[dependency-groups]
deploy = [
    "huggingface-hub>=2.4.0",
]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
docs = [
    "matplotlib>=3.11.2",
]
eval = [
    "anthropic[mcp]>=2.6.0",
    "pyyaml>=6.0.3",
]
notebook = [
    "jupyterlab>=4.6.6",
]
