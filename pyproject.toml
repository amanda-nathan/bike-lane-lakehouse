[project]
name = "bikelake"
version = "0.1.0"
description = "Bike lanes, bikes, cars and crashes in Boston and NYC on an Iceberg + Trino lakehouse"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.29",
    "dagster-webserver>=1.13.29",
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "pyiceberg[pyarrow]>=0.9",
    "python-dotenv>=1.2.4",
    "requests>=2.32",
    "trino>=0.333",
]

[project.scripts]
bikelake = "bikelake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikelake"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
notebook = [
    "jupyterlab>=4.6.6",
]
